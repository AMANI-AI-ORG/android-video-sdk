name: Verify publish PR

# Required status check on main. A pull request may only ADD new version folders under maven/ (plus
# the regenerated maven-metadata.xml next to them): no published file is ever changed or deleted. Every added folder must contain only its artifacts,
# their checksum files, SHA256SUMS, RELEASE_NOTES.md and release.json, all consistent with the bytes;
# its tag must not exist yet; the branch must say what the pull request is (release/<version>: exactly
# that one new version; release/backfill-…: only backfilled versions); and the pull request must come
# from this repository, opened by github-actions[bot] (open-release-pr.yml, for a branch a maintainer
# listed in LOCAL_PUBLISHERS pushed) or by the SDK repository's publishing App (repository variable
# PUBLISHER_BOT, optional) — with every commit by that bot or by such a maintainer. A pull request opened by a listed maintainer themself (older flow) is still accepted
# when every commit is theirs; they then cannot approve it.
#
# pull_request_target on purpose: the workflow and scripts/maven_site.py run from main, so a pull
# request cannot weaken its own check by editing them. The pull request's files are only READ (git
# diff, file hashes, JSON) — nothing from it is executed. Keep it that way: never run, source or
# import anything from the PR checkout.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  # Re-run by publish-on-approval.yml on the approved head before it merges the pull request.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Base (main) — provides the trusted scripts/maven_site.py.
      - uses: actions/checkout@v4
        with:
          # The PR's base commit, whatever the triggering event (pull_request_target or a review).
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] \
            || { echo "::error::PR head moved while checking — re-run."; exit 1; }
          # Read-only working tree of the PR head, outside the trusted checkout.
          git worktree add --quiet --detach "$RUNNER_TEMP/pr" "$HEAD_SHA"

      - name: Only new version folders (and their maven-metadata.xml) under maven/
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          dirs=()
          : > "$RUNNER_TEMP/maven-changed"
          # Three-dot: changes of the PR since it branched off, not main's newer commits.
          # -z: paths are NUL-separated and never quoted, so no path can slip past the maven/ match.
          git diff -z --name-status --no-renames "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/diff.z"
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            case "$path" in
              maven/*) echo yes > "$RUNNER_TEMP/maven-changed" ;;
              *) continue ;;   # README, workflows, … are reviewed as normal changes
            esac
            # The per-artifact maven-metadata.xml (+ checksums) is rewritten by every release;
            # its content is checked against the version folders in a later step.
            case "$(basename "$path")" in
              maven-metadata.xml|maven-metadata.xml.sha1|maven-metadata.xml.sha256)
                if [ "$status" = "A" ] || [ "$status" = "M" ]; then continue; fi ;;
            esac
            if [ "$status" != "A" ]; then
              echo "::error file=$path::Published files must never change ($status $path). Release a new version instead."
              bad=1; continue
            fi
            dir="$(dirname "$path")"
            if git cat-file -e "${BASE_SHA}:${dir}" 2>/dev/null; then
              echo "::error file=$path::$dir already exists on main — published versions are never modified."
              bad=1; continue
            fi
            dirs+=("$dir")
          done < "$RUNNER_TEMP/diff.z"
          [ "$bad" = 0 ] || exit 1
          printf '%s\n' "${dirs[@]:-}" | sort -u | sed '/^$/d' > "$RUNNER_TEMP/dirs.txt"
          echo "Added version folders:"; cat "$RUNNER_TEMP/dirs.txt" || true

      # Allowed publishers:
      #   - github-actions[bot]: open-release-pr.yml opens the PR (GITHUB_TOKEN) for a branch a
      #     maintainer pushed (that maintainer's commits).
      #   - PUBLISHER_BOT (optional): the SDK repository's publishing App, which opens its own PR with
      #     its own commits.
      #   - LOCAL_PUBLISHERS: SDK maintainers' GitHub logins (space or comma separated) whose commits
      #     (/amani-manual-publish-pr, /amani-backfill-versions) may be published. Empty = App only.
      # Every commit must be authored AND committed by the same allowed login (GitHub resolves the
      # login from the commit e-mail, so it must be linked to that account).
      - name: Version folders come from an allowed publisher only
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PUBLISHER_BOT: ${{ vars.PUBLISHER_BOT }}
          LOCAL_PUBLISHERS: ${{ vars.LOCAL_PUBLISHERS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/dirs.txt" ] || exit 0
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Version folders may only come from a branch of this repository (this pull request is from ${HEAD_REPO:-a fork})."
            exit 1
          fi
          IFS=', ' read -r -a logins <<< "$LOCAL_PUBLISHERS"
          listed() { local l; for l in "${logins[@]:-}"; do [ -n "$l" ] && [ "$l" = "$1" ] && return 0; done; return 1; }
          if [ "$AUTHOR" = "github-actions[bot]" ] || { [ -n "$PUBLISHER_BOT" ] && [ "$AUTHOR" = "$PUBLISHER_BOT" ]; }; then
            allowed=("$AUTHOR" "${logins[@]:-}")
          elif listed "$AUTHOR"; then
            echo "::notice::Pull request opened by maintainer $AUTHOR (listed in LOCAL_PUBLISHERS) — they cannot approve it themselves."
            allowed=("$AUTHOR")
          else
            echo "::error::Version folders under maven/ may only be added by github-actions[bot]${PUBLISHER_BOT:+, $PUBLISHER_BOT} or a login in LOCAL_PUBLISHERS (this pull request is from $AUTHOR). Publish through the release workflow in the SDK repository."
            exit 1
          fi
          # Every commit, not just the PR author: a commit pushed on top of the branch by anyone
          # else (even with consistent checksums) is rejected.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" --paginate \
            --jq '.[] | "\(.sha) \(.author.login // "-") \(.committer.login // "-")"' > "$RUNNER_TEMP/commits.txt"
          others=""
          while read -r sha a c; do
            ok=0
            for l in "${allowed[@]}"; do [ -n "$l" ] && [ "$a" = "$l" ] && [ "$c" = "$l" ] && ok=1; done
            [ "$ok" = 1 ] || others="${others}${sha} ${a} ${c}"$'\n'
          done < "$RUNNER_TEMP/commits.txt"
          if [ -n "$others" ]; then
            echo "::error::Commits not authored and committed by an allowed publisher (${allowed[*]}) — a commit e-mail not linked to a GitHub account shows as '-':"
            printf '%s' "$others"
            exit 1
          fi

      - name: Verify contents, checksums and release.json
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/dirs.txt" ] || { echo "No version folders added."; exit 0; }
          # Trusted script from main, PR files as data.
          SCRIPT="$GITHUB_WORKSPACE/scripts/maven_site.py"
          cd "$RUNNER_TEMP/pr"
          xargs python3 -I "$SCRIPT" verify maven < "$RUNNER_TEMP/dirs.txt"

      - name: maven-metadata.xml matches the version folders
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/maven-changed" ] || { echo "No maven/ changes."; exit 0; }
          # Customers read maven-metadata.xml straight from the repository: it must list exactly
          # the version folders of the PR head (trusted script from main, PR files as data).
          cd "$RUNNER_TEMP/pr"
          python3 -I "$GITHUB_WORKSPACE/scripts/maven_site.py" check-metadata maven

      # The branch name is the release type: release/<version> publishes exactly that one new version
      # (tag + GitHub Release after approval); release/backfill-… adds only backfilled old versions
      # (no tag, no release). Anything else must not add version folders.
      - name: Branch name matches the release type
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/dirs.txt" ] || exit 0
          python3 -I - "$HEAD_REF" "$RUNNER_TEMP/pr" "$RUNNER_TEMP/dirs.txt" <<'PY'
          import json, os, re, sys
          ref, root, dirs = sys.argv[1], sys.argv[2], [l.strip() for l in open(sys.argv[3]) if l.strip()]
          rels = {d: json.load(open(os.path.join(root, d, "release.json"))) for d in dirs}
          def fail(msg):
              print(f"::error::{msg}"); sys.exit(1)
          if ref.startswith("release/backfill-"):
              bad = [d for d, r in rels.items() if r.get("backfilled") is not True]
              if bad:
                  fail(f"{ref} is a backfill branch, but {', '.join(bad)} is not marked backfilled — a new version goes on release/<version>.")
              print(f"Backfill of {', '.join(r['version'] for r in rels.values())}: no tag, no release.")
          elif re.fullmatch(r"release/[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*", ref):
              want = ref[len("release/"):]
              if len(rels) != 1:
                  fail(f"{ref} must add exactly one version folder (it adds {len(rels)}).")
              (d, r), = rels.items()
              if r.get("backfilled") is True:
                  fail(f"{d} is backfilled — backfills go on a release/backfill-… branch.")
              if r.get("version") != want:
                  fail(f"{ref} adds version {r.get('version')} — the branch and the version must match.")
              print(f"New version {want}: tag and GitHub Release after approval.")
          else:
              fail(f"Version folders may only be added from release/<version> or release/backfill-… (this branch is {ref}).")
          PY

      - name: Tags must not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/dirs.txt" ] || exit 0
          # exists <api path>: 0 = exists, 1 = HTTP 404; any other failure fails the check.
          exists() {
            local out
            if out="$(gh api "$1" 2>&1 >/dev/null)"; then return 0; fi
            if grep -q 'HTTP 404' <<<"$out"; then return 1; fi
            echo "::error::GitHub API call 'GET $1' failed: $out"; exit 1
          }
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          while read -r dir; do
            json="$RUNNER_TEMP/pr/$dir/release.json"
            [ -f "$json" ] || continue
            read -r tag backfilled < <(python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r["tag"], r.get("backfilled") is True)' "$json")
            # Backfilled (old) versions get no tag and no release: nothing to collide with.
            if [ "$backfilled" = "True" ]; then
              echo "$dir is backfilled — no tag or release will be created."
              continue
            fi
            if exists "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"; then
              echo "::error file=$dir/release.json::Tag $tag already exists."
              exit 1
            fi
            # Includes drafts (GET releases/tags/{tag} does not return them).
            if grep -qxF "$tag" "$RUNNER_TEMP/release-tags.txt"; then
              echo "::error file=$dir/release.json::A release (or draft) for $tag already exists."
              exit 1
            fi
          done < "$RUNNER_TEMP/dirs.txt"

      - name: Summary
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/dirs.txt" ] || exit 0
          while read -r dir; do
            [ -f "$RUNNER_TEMP/pr/$dir/SHA256SUMS" ] || continue
            { echo "### ${dir#maven/}"; echo '```'; cat "$RUNNER_TEMP/pr/$dir/SHA256SUMS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/dirs.txt"
