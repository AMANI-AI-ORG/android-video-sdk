name: Open release PR

# A maintainer listed in repository variable LOCAL_PUBLISHERS pushes a branch built on their machine
# by /amani-manual-publish-pr (release/<version>) or /amani-backfill-versions (release/backfill-…).
# This workflow opens its pull request to main with this repository's GITHUB_TOKEN, so the pull
# request's author is github-actions[bot] and the maintainer who pushed can approve it. No App, key or
# secret is needed. Nothing is merged or released here: approving the pull request runs
# publish-on-approval.yml, which re-runs "Verify publish PR" on the approved head before it merges.
#
# GitHub starts no workflow for events caused by GITHUB_TOKEN, so "Verify publish PR" does not run
# when this pull request is opened. It runs on approval (and blocks the merge if it fails), and on
# any edit of the pull request description by a maintainer, e.g. when the release notes are written.
#
# Requires the repository setting Actions > General > "Allow GitHub Actions to create and approve
# pull requests". Pushes made by the SDK repository's publishing App (vars.PUBLISHER_BOT, which
# opens its own PR) are skipped. Restrict who may create/update release/** branches (ruleset) to the
# LOCAL_PUBLISHERS: a push-run workflow comes from the pushed branch.

on:
  push:
    branches: ['release/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: github.event.deleted == false && github.actor != vars.PUBLISHER_BOT
    runs-on: ubuntu-latest
    steps:
      - name: Pusher and branch are allowed, no open PR yet
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          LOCAL_PUBLISHERS: ${{ vars.LOCAL_PUBLISHERS }}
        run: |
          set -euo pipefail
          echo "open=false" >> "$GITHUB_OUTPUT"
          allowed=0
          IFS=', ' read -r -a logins <<< "$LOCAL_PUBLISHERS"
          for login in "${logins[@]:-}"; do
            [ -n "$login" ] && [ "$login" = "$ACTOR" ] && allowed=1
          done
          if [ "$allowed" != 1 ]; then
            echo "::error::${ACTOR} is not listed in repository variable LOCAL_PUBLISHERS — no pull request opened."
            exit 1
          fi
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*|backfill-[A-Za-z0-9._-]+)$ ]]; then
            echo "::error::$BRANCH is not release/<version> or release/backfill-… — no pull request opened."
            exit 1
          fi
          n="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$n" != 0 ]; then
            echo "::notice::$BRANCH already has an open pull request — it shows the new commits; nothing to do."
            exit 0
          fi
          echo "open=true" >> "$GITHUB_OUTPUT"

      # main: the trusted PR template; the pushed branch is only read (git show), never executed.
      - uses: actions/checkout@v4
        if: steps.check.outputs.open == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Title and body
        id: text
        if: steps.check.outputs.open == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/push/head"
          [ "$(git rev-parse refs/remotes/push/head)" = "$HEAD_SHA" ] \
            || { echo "::error::$BRANCH moved while opening its pull request — the newer push opens it."; exit 1; }
          # "amanivideosdk 1.10.0" / "backfill amanivideosdk 1.8.0, 1.9.0" from the added release.json files.
          git diff --name-only --diff-filter=A "origin/main...${HEAD_SHA}" -- maven | { grep '/release\.json$' || true; } > "$RUNNER_TEMP/added.txt"
          [ -s "$RUNNER_TEMP/added.txt" ] || { echo "::error::$BRANCH adds no version folder under maven/."; exit 1; }
          : > "$RUNNER_TEMP/rel.jsonl"
          while read -r p; do git show "${HEAD_SHA}:${p}" | tr -d '\n' >> "$RUNNER_TEMP/rel.jsonl"; echo >> "$RUNNER_TEMP/rel.jsonl"; done < "$RUNNER_TEMP/added.txt"
          read -r kind msg < <(python3 -I -c '
          import json, sys
          rs = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          back = all(r.get("backfilled") is True for r in rs)
          vs = ", ".join(r["version"] for r in rs)
          print(("backfill" if back else "release") + " " + ("backfill " if back else "") + rs[0]["artifactId"] + " " + vs)
          ' "$RUNNER_TEMP/rel.jsonl")
          echo "title=chore(release): ${msg}" >> "$GITHUB_OUTPUT"
          {
            if [ "$kind" = backfill ]; then
              echo "Backfill of old versions: served from the Maven repository after approval; no tag and no GitHub Release."
            else
              cat .github/pull_request_template.md
            fi
            echo
            echo "Branch pushed by \`${ACTOR}\`; pull request opened by github-actions[bot] so a maintainer (also the one who pushed) can approve it. \"Verify publish PR\" runs when it is approved (or when this description is edited)."
          } > "$RUNNER_TEMP/body.md"

      - name: Open the pull request (GITHUB_TOKEN, author github-actions[bot])
        if: steps.check.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ steps.text.outputs.title }}
        run: |
          set -euo pipefail
          url="$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Opened $url — approving it runs \"Verify publish PR\" and then publishes."
