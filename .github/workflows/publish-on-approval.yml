name: Publish approved release PR

# Release pull requests (branch release/<version> or release/backfill-…, opened by the publishing
# GitHub App) are merged by this workflow when a maintainer approves them — never by hand:
#   1. verify  — the same checks as "Verify publish PR" (reusable workflow), on the approved head;
#   2. merge   — the approval must be by a maintainer with write access, for the PR's latest commit,
#                and by someone other than the PR author; the PR must only add files under maven/ and
#                contain main's latest commit; then the pull request ITSELF is merged (merge commit,
#                pinned to the approved head SHA), so the reviewed commit is what lands on main;
#   3. release — release-maven.yml checks the served AAR; a new version gets its tag on the pull
#                request's commit and a GitHub Release with the PR's "### Release notes"; a backfill
#                gets neither.
#
# Pull requests that change anything outside maven/ are left alone (merge them normally).
# The merge uses GITHUB_TOKEN under the main ruleset (approval + "Verify publish PR" required), so
# GitHub Actions needs no bypass. Repository setting "Allow merge commits" must be on.
# A release PR merged by hand gets no tag and no release (release-maven.yml refuses it).

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/verify-publish-pr.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.merge.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Approval is by a maintainer, for the latest commit, by someone else
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
          REVIEWER: ${{ github.event.review.user.login }}
          ASSOCIATION: ${{ github.event.review.author_association }}
        run: |
          set -euo pipefail
          # On a public repository ANY GitHub user can submit an "approved" review. Only a reviewer
          # with write access to this repository may publish (fails closed if it cannot be read).
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "::error::${REVIEWER} (${ASSOCIATION}) is not a maintainer of this repository — approval ignored."; exit 1 ;;
          esac
          perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${REVIEWER}/permission" --jq .permission)" \
            || { echo "::error::Could not read ${REVIEWER}'s permission — approval ignored."; exit 1; }
          case "$perm" in
            admin|maintain|write) ;;
            *) echo "::error::${REVIEWER} has '${perm}' access — write access is needed to publish."; exit 1 ;;
          esac
          read -r state head author < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.state) \(.head.sha) \(.user.login)"')
          [ "$state" = "open" ] || { echo "::error::PR #${PR_NUMBER} is ${state}."; exit 1; }
          [ "$head" = "$REVIEW_SHA" ] || { echo "::error::The approval is for ${REVIEW_SHA}, the PR head is ${head}. Approve the latest commit."; exit 1; }
          [ "$REVIEWER" != "$author" ] || { echo "::error::A release PR must be approved by someone other than its author."; exit 1; }

      - name: Merge the pull request (approved head only)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.review.commit_id }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] \
            || { echo "::error::PR head moved after the approval — approve again."; exit 1; }

          # Only maven/ changes are published: new version folders (A) and the artifact's
          # maven-metadata.xml (+ checksums, A or M). Anything else → leave the PR to a normal merge.
          n=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            case "$path" in
              maven/*) ;;
              *) echo "::notice::PR #${PR_NUMBER} changes $path (outside maven/) — not a release PR, nothing published."; exit 0 ;;
            esac
            case "$status" in A|M) n=$((n+1)) ;; *) echo "::error::$status $path — published files never change."; exit 1 ;; esac
          done < <(git diff -z --name-status --no-renames "origin/main...${HEAD_SHA}")
          [ "$n" -gt 0 ] || { echo "::notice::No maven/ changes — nothing to publish."; exit 0; }

          # The PR must contain main's latest commit: then the merge result is exactly the approved
          # tree (maven-metadata.xml was generated over main + the new folders and verified as such).
          git merge-base --is-ancestor origin/main "$HEAD_SHA" \
            || { echo "::error::main moved since this pull request was made — rebase release branch onto main (the metadata must list the newer versions too), push, and approve again."; exit 1; }

          # Commit title from the added release.json files: "amanivideosdk 1.10.0", "backfill amanivideosdk 1.8.0, 1.9.0".
          msg="$(git diff --name-only --diff-filter=A "origin/main...${HEAD_SHA}" -- maven | { grep '/release\.json$' || true; } \
            | while read -r f; do git show "${HEAD_SHA}:${f}" | python3 -I -c 'import json,sys; r=json.load(sys.stdin); print(("backfill " if r.get("backfilled") is True else "") + r["artifactId"] + " " + r["version"])'; done \
            | paste -sd ',' - | sed 's/,/, /g')"
          [ -n "$msg" ] || msg="maven repository update"

          # Merge exactly the approved commit; GitHub refuses if the head moved or a rule is not met.
          merged="$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge -f sha="$HEAD_SHA" \
            -f commit_title="chore(release): ${msg} (#${PR_NUMBER})" \
            -f commit_message="Approved by ${REVIEWER}." --jq '.sha')" \
            || { echo "::error::GitHub did not merge PR #${PR_NUMBER} (head moved, rules not met or merge commits disabled) — nothing published."; exit 1; }
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Merged PR #${PR_NUMBER} (${msg}) → ${merged}" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the release branch
        if: steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" >/dev/null \
            || echo "::warning::Could not delete ${HEAD_REF} — delete it by hand."

  release:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release-maven.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
